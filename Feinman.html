<html>
  <body>
  
      <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js">
let particles = [];
let interactions = [];

function setup() {
  createCanvas(800, 600);
  noLoop(); // We only need to draw once
}

function draw() {
  background(0);
  strokeWeight(2);
  
  // Define particle positions (randomized for variation)
  let p1 = createVector(100, height / 2);
  let p2 = createVector(300, height / 3);
  let p3 = createVector(500, height / 3);
  let p4 = createVector(700, height / 2);

  // Interaction vertex (holographic node)
  let vertex = createVector(width / 2, height / 2);

  // Store particles
  particles = [p1, p2, p3, p4];

  // Draw entanglement-driven propagators (curved)
  drawCurvedPropagator(p1, vertex, color(0, 255, 255));
  drawCurvedPropagator(p2, vertex, color(255, 100, 255));
  drawCurvedPropagator(vertex, p3, color(255, 255, 0));
  drawCurvedPropagator(vertex, p4, color(255, 150, 50));

  // Draw particles
  drawParticles();

  // Draw interaction vertex
  fill(255);
  ellipse(vertex.x, vertex.y, 10, 10);
}

function drawParticles() {
  fill(255);
  for (let p of particles) {
    ellipse(p.x, p.y, 8, 8);
  }
}

function drawCurvedPropagator(start, end, col) {
  stroke(col);
  noFill();
  
  let control = createVector((start.x + end.x) / 2, (start.y + end.y) / 2 - 50); // Curve it upward
  bezier(start.x, start.y, control.x, control.y, control.x, control.y, end.x, end.y);
}

    </script>
  </body>
</html>
