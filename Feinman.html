<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feynman Diagram: Kaluza-Klein Interaction</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        canvas {
            border: 1px solid #000;
        }
    </style>
</head>
<body>
    <script>
        function setup() {
            createCanvas(400, 400);
            noLoop(); // Draw only once
        }

        function draw() {
            background(255); // White background
            strokeWeight(2);

            // Define the vertex position (center of the diagram)
            let vertexX = width / 2;
            let vertexY = height / 2;

            // Define the endpoints of the three lines (incoming and outgoing particles)
            // Incoming particle 1 (mode n): from bottom-left to vertex
            let line1StartX = vertexX - 100;
            let line1StartY = vertexY + 100;
            // Incoming particle 2 (mode m): from bottom-right to vertex
            let line2StartX = vertexX + 100;
            let line2StartY = vertexY + 100;
            // Outgoing particle (mode -n-m): from vertex to top
            let line3EndX = vertexX;
            let line3EndY = vertexY - 100;

            // Draw the lines with arrows
            stroke(0); // Black lines

            // Incoming line 1 (mode n)
            drawArrow(line1StartX, line1StartY, vertexX, vertexY);
            // Incoming line 2 (mode m)
            drawArrow(line2StartX, line2StartY, vertexX, vertexY);
            // Outgoing line (mode -n-m)
            drawArrow(vertexX, vertexY, line3EndX, line3EndY);

            // Highlight the vertex with a red dot
            fill(255, 0, 0); // Red
            noStroke();
            ellipse(vertexX, vertexY, 10, 10);

            // Add labels for the mode numbers
            textSize(16);
            textAlign(CENTER, CENTER);
            fill(0, 0, 255); // Blue text
            // Label for mode n (near the incoming line 1)
            text('n', (line1StartX + vertexX) / 2 - 20, (line1StartY + vertexY) / 2);
            // Label for mode m (near the incoming line 2)
            text('m', (line2StartX + vertexX) / 2 + 20, (line2StartY + vertexY) / 2);
            // Label for mode -n-m (near the outgoing line)
            text('-n-m', (vertexX + line3EndX) / 2, (vertexY + line3EndY) / 2 - 20);

            // Add a title
            textSize(18);
            fill(0);
            text('Feynman Diagram: Kaluza-Klein Interaction', width / 2, 30);
        }

        // Function to draw an arrow between two points
        function drawArrow(startX, startY, endX, endY) {
            stroke(0);
            line(startX, startY, endX, endY);

            // Calculate the direction of the arrowhead
            let angle = atan2(endY - startY, endX - startX);
            let arrowSize = 10;

            // Draw the arrowhead
            push();
            translate(endX, endY);
            rotate(angle);
            line(0, 0, -arrowSize, arrowSize / 2);
            line(0, 0, -arrowSize, -arrowSize / 2);
            pop();
        }
    </script>
</body>
</html>
