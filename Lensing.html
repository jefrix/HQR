<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravitational Lensing: GR vs. HQR</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #151e3f;
            color: #e0e0e0;
        }
        canvas {
            background: black;
            display: block;
            margin: 20px auto;
        }
        .controls {
            margin: 20px;
        }
        .slider {
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>Gravitational Lensing: General Relativity vs. HQR</h1>
    <p>Red: HQR Prediction | Blue: General Relativity</p>
    
    <div class="controls">
        <label>Lens Mass:</label>
        <input type="range" id="massSlider" class="slider" min="5000" max="20000" value="10000">
        <span id="massValue">10000</span>
    </div>

    <canvas id="lensingCanvas"></canvas>
    <script>
        const canvas = document.getElementById("lensingCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 600;
        canvas.height = 400;

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const lensRadius = 40;
        const numLightRays = 20;
        let massFactor = 10000; // Default mass factor

        document.getElementById("massSlider").addEventListener("input", function() {
            massFactor = this.value;
            document.getElementById("massValue").innerText = this.value;
            render();
        });
        
        function drawLens() {
            ctx.beginPath();
            ctx.arc(centerX, centerY, lensRadius, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
        }
        
        function drawLightPaths() {
            for (let i = -numLightRays / 2; i < numLightRays / 2; i++) {
                let startX = 50;
                let startY = centerY + i * 8;
                let endX = canvas.width - 50;
                let endY = centerY + i * 8;

                // GR Bending (blue)
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                for (let x = startX; x < endX; x += 10) {
                    let curveFactor = massFactor / (Math.abs(x - centerX) + 100);
                    let y = startY + curveFactor * (startY > centerY ? 1 : -1);
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = "blue";
                ctx.stroke();

                // HQR Bending (red, more deviation)
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                for (let x = startX; x < endX; x += 10) {
                    let curveFactor = (massFactor * 1.2) / (Math.abs(x - centerX) + 100);
                    let y = startY + curveFactor * (startY > centerY ? 1.1 : -1.1);
                    ctx.lineTo(x, y);
                }
                ctx.strokeStyle = "red";
                ctx.stroke();
            }
        }
        
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawLens();
            drawLightPaths();
        }

        render();
    </script>
</body>
</html>
