<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HQR Equation Visualization - Infogeometric Curvature Identity</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #eee; text-align: center; }
        canvas { background-color: #222; margin-top: 20px; }
        input { padding: 5px; margin: 10px; }
        button { padding: 8px 15px; }
    </style>
</head>
<body>

<h2>Visualization of Infogeometric Curvature Identity (HQR)</h2>

<div>
    <label>Initial I(x): <input type="number" id="initialI" value="1" step="0.1"></label>
    <label>Rate of change (dI/dx): <input type="number" id="rateChange" value="0.5" step="0.1"></label>
    <button onclick="plotHQR()">Plot Equation</button>
</div>

<canvas id="hqrChart" width="800" height="400"></canvas>

<script src="hqr.js"></script>
</body>
</html>
