<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HQR Equation Visualizations</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r164/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .plot-container, .visualization-3d {
            width: 80%;
            margin: auto;
            margin-top: 30px;
            padding: 15px;
            background-color: #1e1e1e;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="plot-container">
        <canvas id="hqr2dChart"></canvas>
        <div style="color:white; font-size:1.2em; margin-top:20px; text-align:center;">
            <strong>Equation Details</strong>
            <p style="color:white; font-size: 1.1em;">
                \[
                R_{\mu\nu}^{QI} = \frac{\partial_{\mu} I\, \partial_{\nu} I}{I^2}
                \]
            </p>
            <div style="color:white; text-align:left; margin-left: 20px;">
                <b>Definitions:</b>
                <ul>
                    <li>\( R_{\mu\nu}^{QI} \): Infogeometric curvature tensor</li>
                    <li>\( I \): Quantum information density scalar field</li>
                    <li>\(\partial_{\mu}, \partial_{\nu}\): Spacetime partial derivatives</li>
                </ul>
            </div>
        </div>
        
        <div class="plot-container">
            <canvas id="chart2D"></canvas>
        </div>

        <div class="visualization-3d" id="3dVisualization" style="height: 500px;"></div>

        <script>
        // 2D Chart Example (for demonstration purposes)
        const ctx = document.getElementById('chart2D').getContext('2d');
        const chart = new Chart(ctx = document.getElementById('chart2D'), {
            type: 'line',
            data: {
                labels: Array.from({length: 101}, (_, i) => (i * 0.1).toFixed(1)),
                datasets: [{
                    label: 'Quantum Info Density (I)',
                    data: Array.from({length: 101}, (_, i) => Math.exp(-0.1*i)),
                    borderColor: 'yellow',
                    backgroundColor: 'yellow',
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true },
                    x: { title: { display: true, text: 'Spatial Coordinate (x)', color: 'white' }},
                    y: { title: { display: true, text: 'Density (I)', color: 'white' } }
                },
                plugins: {
                    legend: {
                        labels: { color: 'white' }
                    }
                }
            }
        });

        // Basic setup for 3D Visualization using Three.js
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        rendererSetup();

        function rendererSetup(){
            const vizContainer = document.querySelector('.visualization-3d');
            renderer.setSize(vizContainer.clientWidth, 500);
            vizContainer.appendChild(renderer.domElement);
        }

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const geometry = new THREE.BoxGeometry(3,3,3);
        const material = new THREE.MeshNormalMaterial({wireframe: true});
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const light = new THREE.PointLight(0xffffff, 1, 100);
        light.position.set(10, 10, 10);
        scene.add(light);

        function animate(){
            requestAnimationFrame(animate);
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
        }

        animate();

    </script>
</body>
</html>
